[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "octoplant-mcp"
version = "2.3.4"
description = "Simple safe handoff interface for Octoplant/versiondog"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
