[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "octoplant-mcp"
version = "1.1.5"
description = "MCP server voor Octoplant/versiondog"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
